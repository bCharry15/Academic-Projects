<header class="header">

  <div class="profile-info">

    <h2>
      {{ nombres }} {{ apellidos }}
    </h2>

    <p class="disciplina">
      {{ disciplina }}
    </p>

    <p class="descripcion">
      {{ descripcion }}
    </p>

    <div class="social-icons">

      <a
        href="#"
        target="_blank"
        aria-label="LinkedIn"
      >
        <i class="fab fa-linkedin"></i>
      </a>

      <a
        href="#"
        target="_blank"
        aria-label="GitHub"
      >
        <i class="fab fa-github"></i>
      </a>

      <a
        href="mailto:correo@ejemplo.com"
        aria-label="Correo electrónico"
      >
        <i class="fas fa-envelope"></i>
      </a>

    </div>

  </div>

</header>
